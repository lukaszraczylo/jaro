[package]
name = "jaro_native"
version = "0.1.0"
edition = "2021"
description = "Native JARO binary decoder (PyO3, abi3)"
publish = false

[lib]
name = "jaro_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["abi3-py310", "extension-module"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
